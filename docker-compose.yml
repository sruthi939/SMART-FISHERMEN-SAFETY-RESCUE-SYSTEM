version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=sfsrs_production_jwt_secret_key
      - DB_TYPE=sqlite
      - DB_FILE=/app/database/sfsrs.db
    volumes:
      - sfsrs_data:/app/database

  ai-service:
    build:
      context: ./ai
      dockerfile: Dockerfile
    ports:
      - "5001:5001"

volumes:
  sfsrs_data:
